window.addEventListener('load', () => {
        initChat();
        loadPresetList();
        if (autoView === 'story') { setTimeout(() => switchView('story'), 500); }
        // Init graph mode UI state
        document.getElementById('graph-mode-preset').classList.toggle('active', graphMode === 'preset');
        document.getElementById('graph-mode-health').classList.toggle('active', graphMode === 'health');
        document.getElementById('preset-select').style.display = graphMode === 'preset' ? '' : 'none';
        document.getElementById('health-period-select').style.display = graphMode === 'health' ? '' : 'none';
        loadStory('week');
        loadRoutineStatus();
        loadPersonas();
        loadWeatherStatus();
        loadSchedulerStatus();
    });

    /* ============================================================
       SECTION 7: Weather & Location
       ============================================================ */

    async function loadWeatherStatus() {
        try {
            const resp = await fetch('/api/location');
            if (resp.ok) {
                const data = await resp.json();
                if (data.location) {
                    const loc = data.location;
                    const icon = document.getElementById('weather-icon');
                    const text = document.getElementById('weather-text');
                    icon.textContent = '🌤️';
                    text.textContent = loc.city || `${loc.lat.toFixed(1)},${loc.lon.toFixed(1)}`;
                }
            }
        } catch (e) {
            console.log('Weather status not available');
        }
    }

    function toggleLocationDialog() {
        document.getElementById('location-dialog').classList.toggle('open');
        document.getElementById('location-overlay').classList.toggle('open');
    }

    async function autoDetectLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                document.getElementById('location-lat').value = pos.coords.latitude.toFixed(4);
                document.getElementById('location-lon').value = pos.coords.longitude.toFixed(4);
                // Reverse geocode using Open-Meteo's geography (limited)
                // For city name, user can fill manually
                document.getElementById('location-city').placeholder = '请手动输入城市名';
            }, (err) => {
                alert('无法获取位置，请手动输入经纬度');
            });
        } else {
            alert('浏览器不支持地理定位');
        }
    }

    async function saveLocation() {
        const lat = parseFloat(document.getElementById('location-lat').value);
        const lon = parseFloat(document.getElementById('location-lon').value);
        const city = document.getElementById('location-city').value;

        if (isNaN(lat) || isNaN(lon)) {
            alert('请输入有效的经纬度');
            return;
        }

        try {
            const resp = await fetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lon, city })
            });
            if (resp.ok) {
                toggleLocationDialog();
                loadWeatherStatus();
            }
        } catch (e) {
            alert('保存失败: ' + e.message);
        }
    }

    async function loadRoutineStatus() {
        try {
            const resp = await fetch('/api/routine');
            if (resp.ok) {
                const data = await resp.json();
                const el = document.getElementById('routine-status');
                if (data.status === 'active' && el) {
                    const dp = data.data_points;
                    const conf = data.confidence || 'very_low';
                    const confText = conf === 'high' ? '模型成熟' : conf === 'medium' ? '学习中' : '数据较少';
                    el.textContent = `routine 模型: ${confText} | 睡眠${dp.sleep}次 运动${dp.exercise}次 情绪${dp.mood}次`;
                    el.style.display = 'block';
                }
            }
        } catch (e) {
            console.log('Routine status not available');
        }
    }

    window.addEventListener('resize', () => {
        if (graphData) {
            if (currentView === 'graph') {
                initGraphForContainer('graph-view');
            } else if (graphSidebarOpen) {
                initGraphForContainer('sidebar');
            }
        }
    });

    /* ============================================================
       SECTION 8: Proactive Scheduler
       ============================================================ */

    async function loadSchedulerStatus() {
        try {
            const resp = await fetch('/api/scheduler');
            if (resp.ok) {
                const data = await resp.json();
                const icon = document.getElementById('proactive-icon');
                const label = document.getElementById('proactive-label');
                const btn = document.getElementById('proactive-toggle');

                if (data.silent_mode) {
                    icon.textContent = '🔇';
                    label.textContent = '安静模式';
                    btn.classList.add('silent');
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '主动关心中';
                    btn.classList.remove('silent');
                }
            }
        } catch (e) {
            console.log('Scheduler status not available');
        }
    }

    async function toggleSilentMode() {
        try {
            const resp = await fetch('/api/scheduler', {
                method: 'GET'
            });
            const status = await resp.json();

            const newResp = await fetch('/api/scheduler/silent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    enable: !status.silent_mode,
                    hours: status.silent_mode ? 0 : 24
                })
            });

            if (newResp.ok) {
                loadSchedulerStatus();
            }
        } catch (e) {
            console.error('Failed to toggle silent mode:', e);
        }
    }

    async function triggerProactiveCheck() {
        try {
            const resp = await fetch('/api/scheduler/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ force: true })
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data.proactive && data.message) {
                    const proactiveMessages = Array.isArray(data.message)
                        ? data.message.filter(Boolean).map(String)
                        : [String(data.message)];
                    if (proactiveMessages.length > 1) {
                        proactiveMessages.forEach((text, index) => {
                            setTimeout(() => {
                                const proactiveMsg = {
                                    role: 'ai',
                                    content: text,
                                    timestamp: new Date().toISOString()
                                };
                                messageHistory.push(proactiveMsg);
                                appendMessageBubble(proactiveMsg);
                                scrollToBottom();
                            }, index * 350);
                        });
                    } else {
                        const proactiveMsg = {
                            role: 'ai',
                            content: proactiveMessages[0],
                            timestamp: new Date().toISOString()
                        };
                        messageHistory.push(proactiveMsg);
                        appendMessageBubble(proactiveMsg);
                        scrollToBottom();
                    }
                } else {
                    alert(`主动检查: ${data.reason || '无可触发'}`);
                }
            }
        } catch (e) {
            alert('主动检查失败: ' + e.message);
        }
    }
    </script>
